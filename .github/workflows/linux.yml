# Build Linux

name: linux

# needed to upload release assets with GITHUB_TOKEN
permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [main, main-es5]
  pull_request:
  # To trigger manually: go to Actions tab → linux → Run workflow
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the draft release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ contains(github.event.head_commit.message, '[publish]') || inputs.publish || false }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup prerequisites
        run: |
          echo "event name: ${{ github.event_name }}"
          sudo apt update
          sudo apt install pkg-config libudev-dev libusb-1.0-0-dev icnsutils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and bundle
        run: |
          npm install
          npm run pack

      - name: Build
        if: env.PUBLISH != 'true'
        run: npm run dist:draft

      - name: Build and publish
        if: env.PUBLISH == 'true'
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blink1Control2-${{ runner.os }}
          path: |
            dist/Blink1Control2*zip
            dist/Blink1Control2*tar.gz
            dist/Blink1Control2*deb
            dist/Blink1Control2*AppImage
            dist/latest*yml
