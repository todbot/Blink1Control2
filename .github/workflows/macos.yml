# Build macOS, optionally sign

name: macos

env:
  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
  MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
  CSC_NAME: ${{ secrets.CSC_NAME }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

on:
  push:
    branches: [main, main-es5]
  pull_request:
  release:
    types: [created]
  # To trigger manually: go to Actions tab → macos → Run workflow
  # Check "Notarize and publish" to do a full notarized build without a commit
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Notarize and publish'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Codesign setup for macOS
        if: env.MACOS_CERTIFICATE != ''
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          npm install
          npm run pack
          npm run dist:draft

      - name: Notarize
        if: "contains(github.event.head_commit.message, '[publish]') || inputs.notarize"
        run: npm run dist:nopub

      - name: Publish
        continue-on-error: true
        if: "contains(github.event.head_commit.message, '[publish]') || inputs.notarize"
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blink1Control2-${{ runner.os }}
          path: |
            dist/Blink1Control2*zip
            dist/Blink1Control2*dmg
            dist/Blink1Control2*blockmap
            dist/latest*yml
