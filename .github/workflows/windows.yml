# Build Windows, optionally sign

name: windows

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

on:
  push:
  pull_request:
  release:
    types: [created]
  # To test signing without publishing: go to Actions tab → windows → Run workflow → check "Sign artifacts"
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign artifacts'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm install
          npm run pack
          npm run dist:draft

      - name: Sign artifacts
        if: "contains(github.event.head_commit.message, '[publish]') || inputs.sign"
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: thingm-signing
          certificate-profile-name: ThingMProfile
          files-folder: dist
          files-folder-filter: exe

      - name: Publish
        continue-on-error: true
        if: "contains(github.event.head_commit.message, '[publish]')"
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blink1Control2-${{ runner.os }}
          path: |
            dist/Blink1Control2*zip
            dist/Blink1Control2*exe
            dist/Blink1Control2*blockmap
            dist/latest*yml
