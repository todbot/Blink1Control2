# Build Windows, optionally sign and publish

name: windows

# needed to upload release assets with GITHUB_TOKEN
permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [main, main-es5]
  pull_request:
  release:
    types: [created]
  # To trigger manually: go to Actions tab → windows → Run workflow
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign artifacts (no publish)'
        type: boolean
        default: false
      publish:
        description: 'Sign and publish to the draft release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ contains(github.event.head_commit.message, '[publish]') || inputs.publish || false }}
      SIGN: ${{ contains(github.event.head_commit.message, '[publish]') || inputs.publish || inputs.sign || false }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and bundle
        run: |
          npm install
          npm run pack

      - name: Build
        if: env.SIGN != 'true'
        run: npm run dist:draft

      # Signing happens inside electron-builder, so app exe, installer, and
      # uninstaller are all signed before anything is published
      - name: Build and sign (and publish)
        if: env.SIGN == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          npx electron-builder --publish=$([ "$PUBLISH" = "true" ] && echo always || echo never) \
            "-c.win.azureSignOptions.publisherName=ThingM Corporation" \
            -c.win.azureSignOptions.endpoint=https://wus2.codesigning.azure.net/ \
            -c.win.azureSignOptions.codeSigningAccountName=thingm-signing \
            -c.win.azureSignOptions.certificateProfileName=ThingMProfile

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blink1Control2-${{ runner.os }}
          path: |
            dist/Blink1Control2*zip
            dist/Blink1Control2*exe
            dist/latest*yml
