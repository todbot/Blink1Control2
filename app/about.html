<html>
<body bgcolor="#f0f0f0">
  <div style="background:#f0f0f0; text-align: center; font-size:85%; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'">
    <h2><img align=center width=64 src="./images/icons/blink1mk2-icon-128px.png"> Blink1Control2 </h2>
    <p> for blink(1) USB RGB LED notification devices. <p>
    <h3><a target="_blank" href="http://blink1.thingm.com/">blink1.thingm.com</a></h3>
    <p>
      Version: <span id="version"></span><br/>
    </p>
    <p>
      For latest version:    <span id="homepage"></span><br/>
      To report issues/bugs: <span id="bugs"></span><br/>
    </p>
    <p>
      Config file: <span id="userData"></span>
    </p>
    <p>
      Electron / Node / Chromium : <span id="versions"></span>
    </p>
  </div>
  <script>
    var p = new URLSearchParams(location.search);
    document.getElementById('version').textContent = p.get('version');
    document.getElementById('homepage').innerHTML = '<a href="' + p.get('homepage') + '">' + p.get('homepage') + '</a>';
    document.getElementById('bugs').innerHTML = '<a href="' + p.get('bugs') + '">' + p.get('bugs') + '</a>';
    document.getElementById('userData').innerHTML = '<a href="file://' + p.get('userData') + '">' + p.get('userData') + '</a>';
    document.getElementById('versions').textContent = p.get('electron') + ' / ' + p.get('node') + ' / ' + p.get('chrome');
  </script>
</body>
</html>
